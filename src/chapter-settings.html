<!-- chapter-settings.html - drop this <section> into settings.html (e.g. under the "Reading" group).
     Uses the same global default the reader falls back to. Needs: mh-ui.css, shell.js (module), chapters.js. -->
<section class="panel set-card" id="chapterDefaults">
  <h3 data-i="chDefaultTitle"></h3>
  <p class="hint" data-i="chDefaultHelp"></p>
  <div class="seg" id="dMode" style="align-self:flex-start">
    <button data-m="none"   data-i="chNone"></button>
    <button data-m="folder" data-i="chFolder"></button>
    <button data-m="pages"  data-i="chPages"></button>
  </div>
  <p class="hint" id="dHelp"></p>
  <label id="dNRow" style="display:flex;align-items:center;gap:12px" hidden>
    <span data-i="pagesPerEp"></span><input class="field" id="dN" type="number" min="1" max="9999" step="1" inputmode="numeric">
  </label>
</section>
<script type="module">
  import { invoke, t, applyI18n, toast } from './shell.js';
  import { sanePages, DEFAULT_PAGES } from './chapters.js';
  const $ = (id) => document.getElementById(id);
  const HELP = { none: 'chNoneHelp', folder: 'chFolderHelp', pages: 'chPagesHelp' };
  let mode = 'folder', pages = DEFAULT_PAGES, timer = 0;

  function render() {
    document.querySelectorAll('#dMode button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === mode)));
    $('dNRow').hidden = mode !== 'pages'; $('dHelp').textContent = t(HELP[mode]);
    if (document.activeElement !== $('dN')) $('dN').value = pages;
  }
  const save = () => { clearTimeout(timer); timer = setTimeout(() => invoke('set_chapter_defaults', { mode, pages }).then(() => toast(t('saved'))).catch(() => {}), 400); };

  $('dMode').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; mode = b.dataset.m; render(); save(); });
  $('dN').addEventListener('input', (e) => { if (e.target.value === '' || +e.target.value < 1) return; pages = sanePages(e.target.value); render(); save(); });
  $('dN').addEventListener('blur', () => { $('dN').value = pages; });

  applyI18n($('chapterDefaults'));
  invoke('get_chapter_defaults').then(d => { mode = d.mode; pages = sanePages(d.pages); render(); }).catch(render);
</script>
