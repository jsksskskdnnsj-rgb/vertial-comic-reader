<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i="app.name"></title>
<link rel="stylesheet" href="mh-ui.css">
</head>
<body>
<div class="app">
  <header id="shell-top"></header>
  <div class="work">
    <nav id="shell-rail"></nav>
    <main class="page-main">
      <div class="page-head"><h1 data-i="imp.title"></h1><span class="muted" data-i="imp.help"></span></div>

      <section class="panel glass">
        <div class="dropzone" id="zone">
          <svg class="dz-icon"><use href="icons.svg#cloud-up"/></svg>
          <h3 data-i="imp.dropTitle"></h3>
          <p data-i="imp.dropSub"></p>
          <div class="dz-btns">
            <button class="btn btn--primary" id="addZips"><svg class="i"><use href="icons.svg#folder"/></svg><span data-i="imp.addZips"></span></button>
            <button class="btn btn--ghost" id="addFolders"><svg class="i"><use href="icons.svg#folder"/></svg><span data-i="imp.addFolders"></span></button>
          </div>
        </div>

        <div class="src-head">
          <h2><span data-i="imp.sources"></span> <span class="muted num" id="srcCount"></span></h2>
          <span class="spacer"></span>
          <button class="btn btn--ghost btn--sm" id="sortBtn"><svg class="i"><use href="icons.svg#wand"/></svg><span data-i="imp.sortByName"></span></button>
          <button class="btn btn--ghost btn--sm" id="clearBtn"><span data-i="imp.clear"></span></button>
        </div>
        <div class="src-list" id="srcList"></div>
        <p class="empty" id="srcEmpty" data-i="imp.empty"></p>

        <div class="set-row">
          <div class="grow"><span data-i="imp.merge"></span><span class="sub muted" data-i="imp.note"></span></div>
          <span class="seg" id="mergeSeg">
            <button data-merge="off" data-i="imp.mergeOff"></button>
            <button data-merge="on" data-i="imp.mergeOn"></button>
          </span>
        </div>
        <div class="set-row" id="nameRow" hidden>
          <div class="grow"><span data-i="imp.mergeName"></span><span class="sub muted" data-i="imp.mergeNameHint"></span></div>
          <input class="field name-field" id="mergeName" type="text" maxlength="120" autocomplete="off">
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="lib.folders"></span></div>
          <select class="select" id="folderSel"><option value="" data-i="lib.noFolder"></option></select>
        </div>
        <div class="go-row">
          <button class="btn btn--primary" id="goBtn"><svg class="i"><use href="icons.svg#download"/></svg><span data-i="nav.import"></span></button>
          <button class="btn btn--ghost" id="openNew" hidden><span data-i="imp.openBook"></span></button>
        </div>
        <p class="hint summary" id="summary"></p>
        <ul class="fail-list" id="failList"></ul>
      </section>
    </main>
  </div>
</div>
<script type="module" src="import.js"></script>
</body>
</html>
