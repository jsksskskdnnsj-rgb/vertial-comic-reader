<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i="app.name"></title>
<link rel="stylesheet" href="mh-ui.css">
</head>
<body>
<div class="app">
  <header id="shell-top"></header>
  <div class="work">
    <nav id="shell-rail"></nav>
    <main class="page-main">
      <div class="lib-layout">
        <aside class="panel glass folder-panel">
          <h3 data-i="lib.folders"></h3>
          <div class="folder-list" id="folders"></div>
          <button class="btn btn--ghost btn--sm folder-new" id="newFolder">
            <svg class="i"><use href="icons.svg#plus"/></svg><span data-i="lib.newFolder"></span>
          </button>
        </aside>
        <section class="panel glass lib-main">
          <div class="page-head">
            <h1 id="title" data-i="lib.title"></h1>
            <span class="muted num" id="count"></span>
            <span class="spacer"></span>
            <label class="sort-label"><span data-i="lib.sort"></span>
              <select class="select" id="sortSel">
                <option value="recent" data-i="lib.sortRecent"></option>
                <option value="added" data-i="lib.sortAdded"></option>
                <option value="name" data-i="lib.sortName"></option>
                <option value="title" data-i="lib.sortTitle"></option>
              </select>
            </label>
          </div>
          <div class="lib-toolbar">
            <span class="seg" id="statusSeg" role="group" data-i-label="lib.statusFilter">
              <button data-status="all"><span data-i="lib.statusAll"></span> <span class="cnt num"></span></button>
              <button data-status="unread"><span data-i="lib.statusUnread"></span> <span class="cnt num"></span></button>
              <button data-status="progress"><span data-i="lib.statusProgress"></span> <span class="cnt num"></span></button>
              <button data-status="finished"><span data-i="lib.statusFinished"></span> <span class="cnt num"></span></button>
            </span>
            <span class="spacer"></span>
            <span class="seg" id="modeSeg" role="group" data-i-label="lib.viewMode">
              <button data-mode="grid" data-i-label="lib.viewGrid" data-i-title="lib.viewGrid"><svg class="i"><use href="icons.svg#grid"/></svg></button>
              <button data-mode="list" data-i-label="lib.viewList" data-i-title="lib.viewList"><svg class="i"><use href="icons.svg#list"/></svg></button>
            </span>
          </div>
          <p class="loading-line" id="libLoading"><span class="spin" aria-hidden="true"></span><span data-i="common.loading"></span></p>
          <div class="cards-row lib-grid" id="grid"></div>
          <div class="lib-pager" id="pager" hidden>
            <button class="btn btn--ghost btn--sm" id="pagePrev" type="button"><span data-i="lib.pagePrev"></span></button>
            <span class="muted num" id="pageLabel"></span>
            <button class="btn btn--ghost btn--sm" id="pageNext" type="button"><span data-i="lib.pageNext"></span></button>
          </div>
          <div class="empty-state" id="empty" hidden>
            <svg class="i"><use href="icons.svg#shelf"/></svg>
            <p id="emptyText"></p>
            <a class="btn btn--primary btn--sm" id="emptyImport" href="import.html" hidden><span data-i="nav.import"></span></a>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>
<script type="module" src="library.js"></script>
</body>
</html>
