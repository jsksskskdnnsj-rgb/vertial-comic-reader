<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i="app.name"></title>
<link rel="stylesheet" href="mh-ui.css">
</head>
<body>
<div class="app">
  <header id="shell-top"></header>
  <div class="work">
    <nav id="shell-rail"></nav>
    <main class="page-main">
      <div class="lib-layout">
        <aside class="panel glass folder-panel">
          <h3 data-i="lib.folders"></h3>
          <div id="folders" style="display:flex;flex-direction:column;gap:3px"></div>
          <button class="btn btn--ghost btn--sm" id="newFolder" style="margin-top:9px">
            <svg class="i"><use href="icons.svg#plus"/></svg><span data-i="lib.newFolder"></span>
          </button>
        </aside>
        <section>
          <div class="page-head">
            <h1 data-i="lib.title"></h1>
            <span class="muted num" id="count"></span>
            <span class="spacer" style="flex:1"></span>
            <label style="font-size:12px;color:var(--muted)"><span data-i="lib.sort"></span>
              <select class="select" id="sortSel">
                <option value="recent" data-i="lib.sortRecent"></option>
                <option value="added" data-i="lib.sortAdded"></option>
                <option value="name" data-i="lib.sortName"></option>
              </select>
            </label>
          </div>
          <div class="cards-row" id="grid" style="grid-template-columns:repeat(auto-fill,minmax(148px,1fr))"></div>
          <p class="empty" id="empty" hidden></p>
        </section>
      </div>
    </main>
  </div>
</div>
<script type="module" src="library.js"></script>
</body>
</html>
