<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i="app.name"></title>
<link rel="stylesheet" href="mh-ui.css">
</head>
<body>
<div class="app">
  <header id="shell-top"></header>
  <div class="work">
    <nav id="shell-rail"></nav>
    <main class="page-main">
      <section class="hero glass">
        <h1 data-i="home.welcome"></h1>
        <p data-i="home.welcomeSub"></p>
        <div class="hero__btns">
          <button class="btn btn--primary" id="heroImport"><svg class="i"><use href="icons.svg#download"/></svg><span data-i="home.pick"></span></button>
          <button class="btn btn--ghost" id="heroBg"><svg class="i"><use href="icons.svg#image"/></svg><span data-i="home.bannerChange"></span></button>
          <button class="btn btn--ghost" id="heroBgReset"><span data-i="home.bannerReset"></span></button>
        </div>
      </section>

      <div class="home-grid">
        <aside class="panel glass history-panel">
          <h2><svg class="i"><use href="icons.svg#clock"/></svg><span data-i="home.recent"></span><span class="spacer"></span><a class="linklike" href="library.html?view=recent" data-i="home.more"></a></h2>
          <div class="hstack" id="recent"></div>
          <div class="empty-state" id="noRecent" hidden>
            <svg class="i"><use href="icons.svg#clock"/></svg>
            <p data-i="home.noRecent"></p>
            <a class="btn btn--ghost btn--sm" href="import.html"><span data-i="nav.import"></span></a>
          </div>
        </aside>

        <div class="home-col">
          <section class="panel glass">
            <div class="dropzone" id="zone">
              <svg class="dz-icon"><use href="icons.svg#cloud-up"/></svg>
              <h3 data-i="home.dropTitle"></h3>
              <p data-i="home.dropSub"></p>
              <div class="dz-btns">
                <button class="btn btn--primary" id="pickFiles"><svg class="i"><use href="icons.svg#folder"/></svg><span data-i="imp.addZips"></span></button>
                <button class="btn btn--ghost" id="pickFolders"><svg class="i"><use href="icons.svg#folder"/></svg><span data-i="imp.addFolders"></span></button>
                <a class="btn btn--ghost" href="scan.html"><svg class="i"><use href="icons.svg#search"/></svg><span data-i="scan.open"></span></a>
              </div>
              <p class="dz-note" data-i="home.dropNote"></p>
            </div>
          </section>

          <section class="panel glass">
            <h2><svg class="i"><use href="icons.svg#sparkle"/></svg><span data-i="home.quick"></span></h2>
            <div class="quick-grid">
              <a class="quick-tile" href="import.html"><svg class="i"><use href="icons.svg#download"/></svg><span><b data-i="home.qImport"></b><span data-i="home.qImportD"></span></span></a>
              <a class="quick-tile" href="library.html"><svg class="i"><use href="icons.svg#shelf"/></svg><span><b data-i="home.qLib"></b><span data-i="home.qLibD"></span></span></a>
              <a class="quick-tile" href="settings.html"><svg class="i"><use href="icons.svg#settings"/></svg><span><b data-i="home.qSet"></b><span data-i="home.qSetD"></span></span></a>
              <a class="quick-tile" href="settings.html#reading"><svg class="i"><use href="icons.svg#scroll"/></svg><span><b data-i="home.qMode"></b><span data-i="home.qModeD"></span></span></a>
            </div>
          </section>

          <section class="panel glass">
            <h2><svg class="i"><use href="icons.svg#plus"/></svg><span data-i="home.added"></span><span class="spacer"></span><a class="linklike" href="library.html?sort=added" data-i="home.more"></a></h2>
            <div class="cards-row" id="added"></div>
            <div class="empty-state" id="noAdded" hidden>
              <svg class="i"><use href="icons.svg#plus"/></svg>
              <p data-i="home.noAdded"></p>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>
</div>
<script type="module" src="home.js"></script>
</body>
</html>
