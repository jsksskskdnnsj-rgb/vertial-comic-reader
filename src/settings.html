<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i="app.name"></title>
<link rel="stylesheet" href="mh-ui.css">
</head>
<body>
<div class="app">
  <header id="shell-top"></header>
  <div class="work">
    <nav id="shell-rail"></nav>
    <main class="page-main">
      <div class="page-head"><h1 data-i="nav.settings"></h1></div>

      <section class="panel glass">
        <h2><svg class="i"><use href="icons.svg#globe"/></svg><span data-i="settings.language"></span></h2>
        <div class="set-row">
          <div class="grow"><span data-i="settings.language"></span><span class="sub muted" data-i="settings.languageHelp"></span></div>
          <select class="select" id="langSel">
            <option value="zh-CN">中文</option>
            <option value="en">English</option>
          </select>
        </div>
      </section>

      <section class="panel glass">
        <h2><svg class="i"><use href="icons.svg#palette"/></svg><span data-i="settings.appearance"></span></h2>
        <div class="set-row">
          <div class="grow"><span data-i="settings.accent"></span></div>
          <div class="swatches" id="accents">
            <button class="swatch" data-accent="#80e5b6" style="background:#80e5b6" aria-label="Emerald"></button>
            <button class="swatch" data-accent="#b7a6f5" style="background:#b7a6f5" aria-label="Lavender"></button>
            <button class="swatch" data-accent="#7cc4f0" style="background:#7cc4f0" aria-label="Sky"></button>
            <button class="swatch" data-accent="#f2a0b5" style="background:#f2a0b5" aria-label="Rose"></button>
            <button class="swatch" data-accent="#eec27f" style="background:#eec27f" aria-label="Amber"></button>
          </div>
          <input type="color" id="accentCustom" value="#80e5b6">
          <button class="btn btn--ghost btn--sm" id="accentReset"><span data-i="settings.accentReset"></span></button>
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="settings.background"></span><span class="sub muted" data-i="settings.backgroundHelp"></span></div>
          <button class="btn btn--ghost btn--sm" id="bgChange"><span data-i="settings.imageChange"></span></button>
          <button class="btn btn--ghost btn--sm" id="bgReset"><span data-i="settings.imageReset"></span></button>
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="settings.bgDim"></span></div>
          <input type="range" id="bgDim" min="0" max="90" step="5">
          <span class="num muted" id="bgDimVal"></span>
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="settings.banner"></span><span class="sub muted" data-i="settings.bannerHelp"></span></div>
          <span class="muted" style="font-size:12px" data-i="settings.backgroundHelp"></span>
        </div>
      </section>

      <section class="panel glass" id="reading">
        <h2><svg class="i"><use href="icons.svg#book-open"/></svg><span data-i="settings.reading"></span></h2>
        <div class="set-row">
          <div class="grow"><span data-i="settings.defaultMode"></span></div>
          <span class="seg" id="modeSeg">
            <button data-mode="scroll" data-i="reader.modeScroll"></button>
            <button data-mode="flip" data-i="reader.modeFlip"></button>
          </span>
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="reader.width"></span></div>
          <input type="range" id="widthRange" min="40" max="100" step="5">
          <span class="num muted" id="widthVal"></span>
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="reader.gap"></span></div>
          <span class="seg" id="gapSeg">
            <button data-gap="0">0</button><button data-gap="8">8</button><button data-gap="16">16</button>
          </span>
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="reader.brightness"></span></div>
          <input type="range" id="dimRange" min="60" max="100" step="5">
          <span class="num muted" id="dimVal"></span>
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="settings.saver"></span><span class="sub muted" data-i="settings.saverHelp"></span></div>
          <input type="checkbox" id="saverChk">
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="settings.autoSpeed"></span></div>
          <input type="range" id="autoRange" min="1" max="10" step="1">
          <span class="num muted" id="autoVal"></span>
        </div>
      </section>

      <section class="panel glass">
        <h2><svg class="i"><use href="icons.svg#list"/></svg><span data-i="chapters.defaultTitle"></span></h2>
        <p class="hint" style="margin-bottom:8px" data-i="chapters.defaultHelp"></p>
        <div class="set-row">
          <div class="grow"><span data-i="chapters.title"></span></div>
          <span class="seg" id="chSeg">
            <button data-chmode="none" data-i="chapters.none"></button>
            <button data-chmode="folder" data-i="chapters.folder"></button>
            <button data-chmode="pages" data-i="chapters.pages"></button>
          </span>
        </div>
        <div class="set-row" id="chNRow">
          <div class="grow"><span data-i="chapters.pagesPer"></span></div>
          <input class="field" id="chN" type="number" min="1" max="9999" step="1" style="width:110px">
        </div>
        <p class="hint" id="chHelp"></p>
      </section>

      <section class="panel glass">
        <h2><svg class="i"><use href="icons.svg#db"/></svg><span data-i="settings.cache"></span></h2>
        <div class="set-row">
          <div class="grow"><span id="cacheStats">…</span></div>
          <button class="btn btn--ghost btn--sm" id="cacheClearBtn"><span data-i="settings.cacheClear"></span></button>
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="settings.cacheLimit"></span></div>
          <input class="field" id="cacheLimitMb" type="number" min="64" step="64" style="width:110px">
          <span class="muted">MB</span>
          <button class="btn btn--ghost btn--sm" id="cacheLimitBtn"><span data-i="common.save"></span></button>
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="lib.folders"></span><span class="sub path-txt" id="dataDir"></span></div>
          <button class="btn btn--ghost btn--sm" id="dataDirOpen"><span data-i="lib.reveal"></span></button>
          <button class="btn btn--ghost btn--sm" id="dataDirChange"><span data-i="settings.imageChange"></span></button>
        </div>
      </section>

      <section class="panel glass">
        <h2><svg class="i"><use href="icons.svg#info"/></svg><span data-i="settings.about"></span></h2>
        <div class="stats-grid" id="statsGrid"></div>
        <p class="hint" style="margin-top:12px"><span data-i="settings.version"></span> <span class="num" id="ver">—</span></p>
      </section>

      <section class="panel glass danger-zone">
        <h2><svg class="i"><use href="icons.svg#trash"/></svg><span data-i="lib.title"></span></h2>
        <div class="set-row">
          <div class="grow"><span data-i="lib.remove"></span><span class="sub muted" data-i="lib.noBooks"></span></div>
          <button class="btn btn--danger btn--sm" id="clearShelf"><span data-i="settings.cacheClear"></span></button>
        </div>
      </section>
    </main>
  </div>
</div>
<script type="module" src="settings.js"></script>
</body>
</html>
