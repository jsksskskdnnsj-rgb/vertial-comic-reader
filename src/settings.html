<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i="app.name"></title>
<link rel="stylesheet" href="mh-ui.css">
</head>
<body>
<div class="app">
  <header id="shell-top"></header>
  <div class="work shell-frame">
    <nav id="shell-rail"></nav>
    <main class="page-main">
      <div class="page-head"><h1 data-i="nav.settings"></h1></div>

      <section class="panel glass">
        <h2><svg class="i"><use href="icons.svg#globe"/></svg><span data-i="settings.language"></span></h2>
        <div class="set-row">
          <div class="grow"><span data-i="settings.language"></span><span class="sub muted" data-i="settings.languageHelp"></span></div>
          <select class="select" id="langSel">
            <option value="zh-CN">中文</option>
            <option value="en">English</option>
          </select>
        </div>
      </section>

      <section class="panel glass">
        <h2><svg class="i"><use href="icons.svg#palette"/></svg><span data-i="settings.appearance"></span></h2>
        <div class="set-row">
          <div class="grow"><span data-i="settings.accent"></span></div>
          <div class="swatches" id="accents"></div>
          <label class="color-pick"><span class="muted" data-i="settings.accentCustom"></span><input type="color" id="accentCustom" value="#80e5b6"></label>
          <button class="btn btn--ghost btn--sm" id="accentReset"><span data-i="settings.accentReset"></span></button>
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="settings.background"></span><span class="sub muted" data-i="settings.backgroundHelp"></span></div>
          <button class="btn btn--ghost btn--sm" id="bgChange"><span data-i="settings.imageChange"></span></button>
          <button class="btn btn--ghost btn--sm" id="bgReset"><span data-i="settings.imageReset"></span></button>
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="settings.bannerImage"></span><span class="sub muted" data-i="settings.bannerImageHelp"></span></div>
          <button class="btn btn--ghost btn--sm" id="bannerChange"><span data-i="settings.imageChange"></span></button>
          <button class="btn btn--ghost btn--sm" id="bannerReset"><span data-i="settings.imageReset"></span></button>
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="settings.bgDim"></span></div>
          <input type="range" id="bgDim" min="0" max="90" step="5">
          <span class="num muted" id="bgDimVal"></span>
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="settings.panelOpacity"></span><span class="sub muted" data-i="settings.panelOpacityHelp"></span></div>
          <input type="range" id="panelOpacity" min="40" max="100" step="2">
          <span class="num muted" id="panelOpacityVal"></span>
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="settings.chromeBlur"></span><span class="sub muted" data-i="settings.chromeBlurHelp"></span></div>
          <input type="range" id="chromeBlur" min="0" max="24" step="2">
          <span class="num muted" id="chromeBlurVal"></span>
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="settings.bgBlur"></span><span class="sub muted" data-i="settings.bgBlurHelp"></span></div>
          <input type="range" id="bgBlur" min="0" max="40" step="2">
          <span class="num muted" id="bgBlurVal"></span>
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="settings.bgFit"></span><span class="sub muted" data-i="settings.fitHelp"></span></div>
          <span class="seg" id="fitSeg">
            <button data-fit="cover" data-i="settings.fitCover"></button>
            <button data-fit="contain" data-i="settings.fitContain"></button>
            <button data-fit="stretch" data-i="settings.fitStretch"></button>
          </span>
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="settings.bgStyle"></span><span class="sub muted" data-i="settings.bgStyleHelp"></span></div>
          <span class="seg" id="bgModeSeg">
            <button data-bgmode="image" data-i="settings.bgStylePicture"></button>
            <button data-bgmode="color" data-i="settings.bgStyleColor"></button>
          </span>
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="settings.bgColor"></span><span class="sub muted" data-i="settings.bgColorHelp"></span></div>
          <div class="swatches" id="bgSwatches"></div>
          <input type="color" id="bgColor" value="#e9f2f2">
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="settings.borderColor"></span><span class="sub muted" data-i="settings.borderHelp"></span></div>
          <div class="swatches" id="borderSwatches"></div>
          <input type="color" id="borderColor" value="#80e5b6">
          <button class="btn btn--ghost btn--sm" id="borderReset"><span data-i="settings.borderReset"></span></button>
        </div>
        <div class="set-row">
          <div class="grow"></div>
          <button class="btn btn--ghost btn--sm" id="appearanceReset"><span data-i="settings.appearanceDefaults"></span></button>
        </div>
      </section>

      <section class="panel glass">
        <h2><svg class="i"><use href="icons.svg#settings"/></svg><span data-i="settings.tray"></span></h2>
        <div class="set-row">
          <div class="grow"><span data-i="settings.closeToTray"></span><span class="sub muted" data-i="settings.closeToTrayHelp"></span></div>
          <input type="checkbox" id="closeToTray" checked>
        </div>
      </section>

      <section class="panel glass" id="reading">
        <h2><svg class="i"><use href="icons.svg#book-open"/></svg><span data-i="settings.reading"></span></h2>
        <div class="set-row">
          <div class="grow"><span data-i="settings.defaultMode"></span></div>
          <span class="seg" id="modeSeg">
            <button data-mode="scroll" data-i="reader.modeScroll"></button>
            <button data-mode="flip" data-i="reader.modeFlip"></button>
          </span>
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="reader.width"></span></div>
          <input type="range" id="widthRange" min="20" max="100" step="5">
          <span class="num muted" id="widthVal"></span>
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="reader.gap"></span></div>
          <span class="seg" id="gapSeg">
            <button data-gap="0">0</button><button data-gap="8">8</button><button data-gap="16">16</button>
          </span>
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="reader.brightness"></span></div>
          <input type="range" id="dimRange" min="60" max="100" step="5">
          <span class="num muted" id="dimVal"></span>
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="settings.saver"></span><span class="sub muted" data-i="settings.saverHelp"></span></div>
          <input type="checkbox" id="saverChk">
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="settings.mergeAuto"></span><span class="sub muted" data-i="settings.mergeAutoHelp"></span></div>
          <input type="checkbox" id="mergeAuto" checked>
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="settings.wheelSpeed"></span><span class="sub muted" data-i="settings.wheelSpeedHelp"></span></div>
          <input type="range" id="wheelRange" min="1" max="5" step="1">
          <span class="num muted" id="wheelVal"></span>
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="settings.autoSpeed"></span></div>
          <input type="range" id="autoRange" min="1" max="10" step="1">
          <span class="num muted" id="autoVal"></span>
        </div>
      </section>

      <section class="panel glass">
        <h2><svg class="i"><use href="icons.svg#list"/></svg><span data-i="chapters.defaultTitle"></span></h2>
        <p class="hint" data-i="chapters.defaultHelp"></p>
        <div class="set-row">
          <div class="grow"><span data-i="chapters.title"></span></div>
          <span class="seg" id="chSeg">
            <button data-chmode="none" data-i="chapters.none"></button>
            <button data-chmode="folder" data-i="chapters.folder"></button>
            <button data-chmode="pages" data-i="chapters.pages"></button>
          </span>
        </div>
        <div class="set-row" id="chNRow">
          <div class="grow"><span data-i="chapters.pagesPer"></span></div>
          <input class="field num-field" id="chN" type="number" min="1" max="9999" step="1">
        </div>
        <p class="hint" id="chHelp"></p>
      </section>

      <section class="panel glass">
        <h2><svg class="i"><use href="icons.svg#db"/></svg><span data-i="settings.cache"></span></h2>
        <div class="set-row">
          <div class="grow"><span id="cacheStats">…</span></div>
          <button class="btn btn--ghost btn--sm" id="cacheClearBtn"><span data-i="settings.cacheClear"></span></button>
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="settings.cacheLimit"></span></div>
          <input class="field num-field" id="cacheLimitMb" type="number" min="64" step="64">
          <span class="muted">MB</span>
          <button class="btn btn--ghost btn--sm" id="cacheLimitBtn"><span data-i="common.save"></span></button>
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="settings.dataDir"></span><span class="sub muted" data-i="settings.dataDirHelp"></span><span class="sub path-txt" id="dataDir"></span><span class="state-chip" id="dataDirState" hidden></span><span class="sub hint warn" id="dataDirRestart" hidden data-i="settings.dataDirRestartMsg"></span></div>
          <button class="btn btn--ghost btn--sm" id="dataDirOpen"><span data-i="lib.reveal"></span></button>
          <button class="btn btn--ghost btn--sm" id="dataDirChange"><span data-i="settings.dataDirChange"></span></button>
          <button class="btn btn--ghost btn--sm" id="dataDirRestore" hidden><span data-i="settings.dataDirRestore"></span></button>
        </div>
      </section>

      <section class="panel glass">
        <h2><svg class="i"><use href="icons.svg#info"/></svg><span data-i="settings.about"></span></h2>
        <div class="stats-grid" id="statsGrid"></div>
        <p class="hint"><span data-i="settings.version"></span> <span class="num" id="ver">—</span></p>
      </section>

      <section class="panel glass" id="metaNetPanel">
        <h2><svg class="i"><use href="icons.svg#globe"/></svg><span data-i="meta.settingsTitle"></span></h2>
        <p class="hint" data-i="meta.settingsHelp"></p>
        <div class="set-row">
          <div class="grow"><span data-i="meta.proxy"></span><span class="sub muted" data-i="meta.proxyHelp"></span></div>
          <input class="field grow" id="metaProxy" type="text" autocomplete="off" placeholder="http://127.0.0.1:7890">
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="meta.bangumiToken"></span><span class="sub muted" data-i="meta.bangumiTokenHelp"></span></div>
          <input class="field grow" id="metaBgmToken" type="password" autocomplete="off">
        </div>
        <div class="set-row">
          <div class="grow" data-i="meta.sources"></div>
          <label class="check"><input type="checkbox" id="metaSrcBgm" checked> Bangumi</label>
          <label class="check"><input type="checkbox" id="metaSrcMu" checked> MangaUpdates</label>
          <label class="check"><input type="checkbox" id="metaSrcAni" checked> AniList</label>
          <label class="check"><input type="checkbox" id="metaSrcC18"> 18comic</label>
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="meta.comic18Domain"></span><span class="sub muted" data-i="meta.comic18DomainHelp"></span></div>
          <input class="field grow" id="metaC18Domain" type="text" autocomplete="off" placeholder="18comic.vip">
        </div>
        <div class="set-row">
          <div class="grow" data-i="meta.proxyPerSource"></div>
          <label class="check"><input type="checkbox" id="metaProxyBgm" checked> Bangumi</label>
          <label class="check"><input type="checkbox" id="metaProxyMu" checked> MU</label>
          <label class="check"><input type="checkbox" id="metaProxyAni" checked> AniList</label>
          <label class="check"><input type="checkbox" id="metaProxyC18" checked> 18comic</label>
        </div>
        <div class="set-row">
          <div class="grow"><span data-i="meta.autoBind"></span><span class="sub muted" data-i="meta.autoBindHelp"></span></div>
          <label class="check"><input type="checkbox" id="metaAutoBind" checked></label>
        </div>
        <div class="set-row">
          <button class="btn btn--ghost btn--sm" id="metaSave" type="button"><span data-i="common.save"></span></button>
          <button class="btn btn--ghost btn--sm" id="metaAutomatch" type="button"><span data-i="meta.batchMatch"></span></button>
        </div>
        <p class="hint muted" id="metaAutomatchOut" hidden></p>
        <p class="hint muted" data-i="meta.legal"></p>
      </section>

      <section class="panel glass" id="tagsPanel">
        <h2><svg class="i"><use href="icons.svg#bookmark"/></svg><span data-i="settings.tags"></span></h2>
        <p class="hint" data-i="settings.tagsHelp"></p>
        <div class="tag-admin" id="tagList"></div>
        <div class="set-row">
          <input class="field" id="tagName" type="text" maxlength="32" placeholder="">
          <button class="btn btn--ghost btn--sm" id="tagAdd" type="button" data-i="settings.tagAdd"></button>
        </div>
      </section>

      <section class="panel glass">
        <h2><svg class="i"><use href="icons.svg#db"/></svg><span data-i="settings.backup"></span></h2>
        <p class="hint" data-i="settings.backupHelp"></p>
        <div class="set-row">
          <button class="btn btn--ghost btn--sm" id="backupExport" type="button" data-i="settings.backupExport"></button>
          <button class="btn btn--ghost btn--sm" id="backupImport" type="button" data-i="settings.backupImport"></button>
          <button class="btn btn--ghost btn--sm" id="dupScan" type="button" data-i="settings.dupScan"></button>
        </div>
        <p class="hint muted num" id="dupOut" hidden></p>
      </section>

      <section class="panel glass danger-zone">
        <h2><svg class="i"><use href="icons.svg#trash"/></svg><span data-i="settings.clearLibrary"></span></h2>
        <div class="set-row">
          <div class="grow"><span data-i="settings.clearLibraryHelp"></span></div>
          <button class="btn btn--danger btn--sm" id="clearShelf"><span data-i="settings.clearLibraryBtn"></span></button>
        </div>
      </section>
    </main>
  </div>
</div>
<script type="module" src="settings.js"></script>
</body>
</html>
