<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小龙骑行 · 海边</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sky-top: #7ec8e8;
      --sky-mid: #b8e4f5;
      --sky-horizon: #e8f6fb;
      --sea-deep: #1a7a9c;
      --sea-mid: #2e9bb8;
      --sea-foam: #a8e4ef;
      --sand: #e8d4a8;
      --sand-path: #d4bc88;
      --dragon: #3d9b6a;
      --dragon-light: #6bc48a;
      --dragon-belly: #c8f0c0;
      --dragon-horn: #f0c060;
      --bike: #2a3540;
      --bike-accent: #e85d4c;
      --ink: #1a2e38;
      --foam: rgba(255, 255, 255, 0.55);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: "Nunito", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--sky-top);
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        linear-gradient(
          180deg,
          var(--sky-top) 0%,
          var(--sky-mid) 38%,
          var(--sky-horizon) 52%,
          var(--sea-mid) 52%,
          var(--sea-deep) 72%,
          var(--sand) 72%,
          #f0e2b8 100%
        );
    }

    /* Brand + copy — one composition, brand as hero signal */
    .brand {
      position: absolute;
      z-index: 20;
      top: clamp(1.25rem, 4vw, 2.5rem);
      left: clamp(1.25rem, 5vw, 3.5rem);
      max-width: min(22rem, 88vw);
      pointer-events: none;
    }

    .brand h1 {
      font-family: "ZCOOL XiaoWei", "Songti SC", serif;
      font-size: clamp(2.6rem, 8vw, 4.4rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1.05;
      color: var(--ink);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .brand p {
      margin-top: 0.65rem;
      font-size: clamp(0.95rem, 2.2vw, 1.15rem);
      font-weight: 600;
      line-height: 1.45;
      color: rgba(26, 46, 56, 0.78);
      max-width: 18rem;
    }

    /* Sun */
    .sun {
      position: absolute;
      top: 8%;
      right: 12%;
      width: clamp(4rem, 10vw, 7rem);
      height: clamp(4rem, 10vw, 7rem);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff8d0 0%, #ffd060 45%, #f0a030 100%);
      animation: sun-breathe 6s ease-in-out infinite;
    }

    @keyframes sun-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    /* Clouds */
    .clouds {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.82);
      border-radius: 999px;
      filter: blur(0.5px);
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }

    .cloud-a {
      width: 7.5rem;
      height: 2.2rem;
      top: 14%;
      left: -10%;
      animation: drift 48s linear infinite;
    }
    .cloud-a::before { width: 3.2rem; height: 3.2rem; top: -1.6rem; left: 1rem; }
    .cloud-a::after { width: 2.4rem; height: 2.4rem; top: -1.1rem; left: 3.6rem; }

    .cloud-b {
      width: 10rem;
      height: 2.6rem;
      top: 22%;
      left: -20%;
      opacity: 0.75;
      animation: drift 72s linear infinite;
      animation-delay: -20s;
    }
    .cloud-b::before { width: 4rem; height: 4rem; top: -2rem; left: 1.5rem; }
    .cloud-b::after { width: 3rem; height: 3rem; top: -1.4rem; left: 5rem; }

    .cloud-c {
      width: 6rem;
      height: 1.8rem;
      top: 10%;
      left: -15%;
      opacity: 0.65;
      animation: drift 56s linear infinite;
      animation-delay: -35s;
    }
    .cloud-c::before { width: 2.6rem; height: 2.6rem; top: -1.3rem; left: 0.8rem; }
    .cloud-c::after { width: 2rem; height: 2rem; top: -0.9rem; left: 3rem; }

    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(130vw); }
    }

    /* Sea layer with animated waves via SVG */
    .sea {
      position: absolute;
      left: 0;
      right: 0;
      top: 52%;
      height: 22%;
      z-index: 3;
      overflow: hidden;
    }

    .sea svg {
      position: absolute;
      bottom: 0;
      width: 200%;
      height: 100%;
    }

    .wave-back {
      animation: wave-slide 14s linear infinite;
      opacity: 0.55;
    }

    .wave-front {
      animation: wave-slide 9s linear infinite reverse;
      opacity: 0.85;
    }

    @keyframes wave-slide {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    /* Sand path stripe */
    .path {
      position: absolute;
      left: 0;
      right: 0;
      top: 74%;
      height: 8%;
      z-index: 4;
      background:
        repeating-linear-gradient(
          90deg,
          var(--sand-path) 0 36px,
          #c9b078 36px 40px,
          var(--sand-path) 40px 76px
        );
      background-size: 200% 100%;
      animation: path-scroll 2.4s linear infinite;
      mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
      opacity: 0.55;
    }

    @keyframes path-scroll {
      from { background-position: 0 0; }
      to { background-position: -80px 0; }
    }

    /* Rider stage */
    .rider-stage {
      position: absolute;
      z-index: 10;
      left: 50%;
      top: 58%;
      width: min(420px, 86vw);
      transform: translate(-50%, -42%);
      animation: ride-bob 0.55s ease-in-out infinite;
    }

    @keyframes ride-bob {
      0%, 100% { transform: translate(-50%, -42%) translateY(0); }
      50% { transform: translate(-50%, -42%) translateY(5px); }
    }

    .rider-stage svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
    }

    .wheel {
      transform-origin: center;
      animation: spin 0.7s linear infinite;
    }

    .wheel-front { transform-box: fill-box; transform-origin: center; }
    .wheel-back { transform-box: fill-box; transform-origin: center; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .leg-pedal {
      transform-box: fill-box;
      transform-origin: 0% 0%;
      animation: pedal 0.7s ease-in-out infinite;
    }

    .leg-pedal.alt {
      animation-delay: -0.35s;
    }

    @keyframes pedal {
      0%, 100% { transform: rotate(-18deg); }
      50% { transform: rotate(22deg); }
    }

    .tail {
      transform-box: fill-box;
      transform-origin: left center;
      animation: tail-wag 1.1s ease-in-out infinite;
    }

    @keyframes tail-wag {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(10deg); }
    }

    .spikes {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: spike-wind 1.4s ease-in-out infinite;
    }

    @keyframes spike-wind {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-4deg); }
    }

    /* Foam dots along shoreline */
    .foam {
      position: absolute;
      z-index: 5;
      left: 0;
      right: 0;
      top: 71.5%;
      height: 1.2%;
      background:
        radial-gradient(circle, var(--foam) 0 40%, transparent 42%) 0 50% / 28px 100% repeat-x;
      animation: foam-crawl 3.5s linear infinite;
      opacity: 0.9;
    }

    @keyframes foam-crawl {
      from { background-position: 0 50%; }
      to { background-position: 28px 50%; }
    }

    /* Distant cliffs / rocks */
    .land {
      position: absolute;
      z-index: 2;
      left: 0;
      right: 0;
      top: 48%;
      height: 5%;
      background:
        radial-gradient(ellipse 8% 100% at 8% 100%, #5a8a78 0 70%, transparent 71%),
        radial-gradient(ellipse 12% 120% at 18% 100%, #4a7a6a 0 70%, transparent 71%),
        radial-gradient(ellipse 6% 90% at 88% 100%, #5a8a78 0 70%, transparent 71%),
        radial-gradient(ellipse 10% 110% at 96% 100%, #457868 0 70%, transparent 71%);
      opacity: 0.55;
    }

    .credit {
      position: absolute;
      z-index: 20;
      right: clamp(1rem, 3vw, 2rem);
      bottom: clamp(0.75rem, 2vw, 1.25rem);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(26, 46, 56, 0.45);
    }

    @media (max-width: 520px) {
      .brand { top: 1rem; left: 1rem; }
      .brand p { max-width: 14rem; }
      .rider-stage { width: 92vw; top: 60%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cloud, .wave-back, .wave-front, .path, .rider-stage,
      .wheel, .leg-pedal, .tail, .spikes, .foam, .sun {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="小龙在海边骑自行车">
    <header class="brand">
      <h1>小龙骑行</h1>
      <p>海风轻推车轮，鳞片上沾一点咸咸的阳光。</p>
    </header>

    <div class="sun" aria-hidden="true"></div>

    <div class="clouds" aria-hidden="true">
      <div class="cloud cloud-a"></div>
      <div class="cloud cloud-b"></div>
      <div class="cloud cloud-c"></div>
    </div>

    <div class="land" aria-hidden="true"></div>

    <div class="sea" aria-hidden="true">
      <svg class="wave-back" viewBox="0 0 1200 200" preserveAspectRatio="none" aria-hidden="true">
        <path fill="#2e9bb8" d="M0,80 C150,40 250,120 400,80 C550,40 650,120 800,80 C950,40 1050,120 1200,80 L1200,200 L0,200 Z"></path>
        <path fill="#2e9bb8" d="M1200,80 C1350,40 1450,120 1600,80 C1750,40 1850,120 2000,80 C2150,40 2250,120 2400,80 L2400,200 L1200,200 Z"></path>
      </svg>
      <svg class="wave-front" viewBox="0 0 1200 200" preserveAspectRatio="none" aria-hidden="true">
        <path fill="#1a7a9c" d="M0,110 C120,70 220,150 360,110 C500,70 600,150 740,110 C880,70 980,150 1200,110 L1200,200 L0,200 Z"></path>
        <path fill="#1a7a9c" d="M1200,110 C1320,70 1420,150 1560,110 C1700,70 1800,150 1940,110 C2080,70 2180,150 2400,110 L2400,200 L1200,200 Z"></path>
      </svg>
    </div>

    <div class="foam" aria-hidden="true"></div>
    <div class="path" aria-hidden="true"></div>

    <div class="rider-stage" aria-hidden="true">
      <svg viewBox="0 0 420 280" role="img" aria-label="小龙骑自行车">
        <!-- soft ground shadow -->
        <ellipse cx="210" cy="248" rx="118" ry="10" fill="rgba(26,46,56,0.12)" />

        <!-- Bicycle -->
        <g class="bike">
          <!-- back wheel -->
          <g class="wheel wheel-back" style="transform-origin: 95px 210px; transform-box: view-box;">
            <circle cx="95" cy="210" r="38" fill="none" stroke="#2a3540" stroke-width="7" />
            <circle cx="95" cy="210" r="28" fill="none" stroke="#2a3540" stroke-width="2" opacity="0.35" />
            <line x1="95" y1="172" x2="95" y2="248" stroke="#2a3540" stroke-width="2.5" />
            <line x1="57" y1="210" x2="133" y2="210" stroke="#2a3540" stroke-width="2.5" />
            <line x1="68" y1="183" x2="122" y2="237" stroke="#2a3540" stroke-width="2" />
            <line x1="122" y1="183" x2="68" y2="237" stroke="#2a3540" stroke-width="2" />
            <circle cx="95" cy="210" r="6" fill="#e85d4c" />
          </g>

          <!-- front wheel -->
          <g class="wheel wheel-front" style="transform-origin: 310px 210px; transform-box: view-box;">
            <circle cx="310" cy="210" r="38" fill="none" stroke="#2a3540" stroke-width="7" />
            <circle cx="310" cy="210" r="28" fill="none" stroke="#2a3540" stroke-width="2" opacity="0.35" />
            <line x1="310" y1="172" x2="310" y2="248" stroke="#2a3540" stroke-width="2.5" />
            <line x1="272" y1="210" x2="348" y2="210" stroke="#2a3540" stroke-width="2.5" />
            <line x1="283" y1="183" x2="337" y2="237" stroke="#2a3540" stroke-width="2" />
            <line x1="337" y1="183" x2="283" y2="237" stroke="#2a3540" stroke-width="2" />
            <circle cx="310" cy="210" r="6" fill="#e85d4c" />
          </g>

          <!-- frame -->
          <path d="M95 210 L175 140 L250 140 L310 210" fill="none" stroke="#2a3540" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M175 140 L175 210" fill="none" stroke="#2a3540" stroke-width="5" stroke-linecap="round" />
          <path d="M175 210 L250 140" fill="none" stroke="#2a3540" stroke-width="4" stroke-linecap="round" />
          <!-- seat -->
          <path d="M155 132 Q175 120 195 132" fill="#2a3540" />
          <rect x="170" y="132" width="8" height="12" rx="2" fill="#2a3540" />
          <!-- handlebar -->
          <path d="M250 140 L268 118" fill="none" stroke="#2a3540" stroke-width="5" stroke-linecap="round" />
          <path d="M255 118 L285 112" fill="none" stroke="#2a3540" stroke-width="5" stroke-linecap="round" />
          <circle cx="285" cy="112" r="5" fill="#e85d4c" />
          <!-- pedal crank -->
          <circle cx="175" cy="210" r="8" fill="#2a3540" />
          <g class="leg-pedal" style="transform-origin: 175px 210px; transform-box: view-box;">
            <line x1="175" y1="210" x2="175" y2="235" stroke="#2a3540" stroke-width="4" stroke-linecap="round" />
            <rect x="162" y="232" width="26" height="7" rx="3" fill="#e85d4c" />
          </g>
        </g>

        <!-- Dragon -->
        <g class="dragon">
          <!-- tail -->
          <g class="tail" style="transform-origin: 120px 150px; transform-box: view-box;">
            <path d="M120 150 Q70 160 45 130 Q55 155 85 165 Q105 170 120 155" fill="#3d9b6a" />
            <path d="M55 138 L48 122 L62 132" fill="#6bc48a" />
            <path d="M72 150 L68 136 L80 145" fill="#6bc48a" />
          </g>

          <!-- body -->
          <ellipse cx="175" cy="145" rx="48" ry="36" fill="#3d9b6a" />
          <ellipse cx="178" cy="152" rx="34" ry="24" fill="#c8f0c0" />

          <!-- back spikes -->
          <g class="spikes" style="transform-origin: 160px 120px; transform-box: view-box;">
            <path d="M140 120 L148 92 L158 118" fill="#6bc48a" />
            <path d="M158 115 L168 88 L176 114" fill="#6bc48a" />
            <path d="M175 114 L186 95 L192 116" fill="#6bc48a" />
          </g>

          <!-- neck + head -->
          <path d="M210 140 Q235 120 248 100" fill="none" stroke="#3d9b6a" stroke-width="28" stroke-linecap="round" />
          <ellipse cx="262" cy="92" rx="32" ry="26" fill="#3d9b6a" />
          <ellipse cx="272" cy="98" rx="18" ry="14" fill="#c8f0c0" />

          <!-- horns -->
          <path d="M245 72 L238 48 L255 68" fill="#f0c060" />
          <path d="M262 68 L268 42 L275 68" fill="#f0c060" />

          <!-- snout -->
          <ellipse cx="290" cy="98" rx="14" ry="10" fill="#6bc48a" />
          <circle cx="298" cy="96" r="2.5" fill="#1a2e38" />
          <!-- smile -->
          <path d="M282 104 Q290 110 298 104" fill="none" stroke="#1a2e38" stroke-width="2" stroke-linecap="round" />
          <!-- eye -->
          <circle cx="268" cy="88" r="6" fill="#fff" />
          <circle cx="270" cy="88" r="3.2" fill="#1a2e38" />
          <circle cx="271.5" cy="86.5" r="1.2" fill="#fff" />
          <!-- cheek -->
          <circle cx="278" cy="100" r="4" fill="#e88a7a" opacity="0.55" />

          <!-- arms on handlebar -->
          <path d="M210 138 Q240 128 275 116" fill="none" stroke="#3d9b6a" stroke-width="10" stroke-linecap="round" />
          <circle cx="278" cy="114" r="7" fill="#6bc48a" />

          <!-- legs -->
          <g class="leg-pedal" style="transform-origin: 168px 168px; transform-box: view-box;">
            <path d="M168 168 Q172 195 170 228" fill="none" stroke="#3d9b6a" stroke-width="12" stroke-linecap="round" />
            <ellipse cx="172" cy="232" rx="12" ry="7" fill="#2a3540" />
          </g>
          <g class="leg-pedal alt" style="transform-origin: 188px 168px; transform-box: view-box;">
            <path d="M188 168 Q182 190 180 220" fill="none" stroke="#2f7d55" stroke-width="11" stroke-linecap="round" opacity="0.9" />
            <ellipse cx="178" cy="224" rx="11" ry="6" fill="#2a3540" />
          </g>

          <!-- little wing -->
          <path d="M155 130 Q130 100 148 108 Q160 112 168 128" fill="#6bc48a" opacity="0.9" />
        </g>

        <!-- motion lines -->
        <g opacity="0.35" stroke="#1a2e38" stroke-width="2" stroke-linecap="round">
          <line x1="40" y1="150" x2="20" y2="150">
            <animate attributeName="x1" values="40;28;40" dur="0.7s" repeatCount="indefinite" />
            <animate attributeName="x2" values="20;8;20" dur="0.7s" repeatCount="indefinite" />
          </line>
          <line x1="48" y1="170" x2="30" y2="170">
            <animate attributeName="x1" values="48;36;48" dur="0.7s" begin="-0.2s" repeatCount="indefinite" />
            <animate attributeName="x2" values="30;18;30" dur="0.7s" begin="-0.2s" repeatCount="indefinite" />
          </line>
          <line x1="36" y1="190" x2="18" y2="190">
            <animate attributeName="x1" values="36;24;36" dur="0.7s" begin="-0.4s" repeatCount="indefinite" />
            <animate attributeName="x2" values="18;6;18" dur="0.7s" begin="-0.4s" repeatCount="indefinite" />
          </line>
        </g>
      </svg>
    </div>

    <p class="credit">Seaside · Bike ride</p>
  </main>
</body>
</html>
